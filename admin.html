<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Best 2 Admin</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:#07111f;color:#eef2ff}button,input,textarea{font:inherit}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 20px}.brand{font-weight:900;font-size:23px;color:#fbbf24}.brand span{color:#8b5cf6}.muted{color:#94a3b8}.btn{border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:800}.primary{background:#6366f1;color:#fff}.danger{background:#7f1d1d;color:#fff}.secondary{background:#17263a;color:#dbeafe}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#101f33;border:1px solid #243754;border-radius:16px;padding:18px}.stat{font-size:30px;font-weight:900;margin-top:8px}.panel{margin-top:18px;background:#0d1a2b;border:1px solid #243754;border-radius:16px;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab.active{background:#6366f1;color:#fff}.hidden{display:none}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #20314a}.badge{padding:4px 8px;border-radius:999px;font-size:12px}.ok{background:#123d2a;color:#86efac}.blocked{background:#451b25;color:#fda4af}.login{max-width:430px;margin:70px auto}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#b8c5d6;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #2b3e5b;background:#081423;color:#fff;outline:0}.field textarea{min-height:80px}.status{min-height:22px;color:#fbbf24;margin-top:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.table{min-width:650px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
</style></head><body><div class="wrap"><div id="loginView" class="login card"><div class="brand">Ludo <span>Best 2</span> Admin</div><p class="muted">Admin Panel Login</p><div class="field"><label>Admin Email</label><input id="aEmail" type="email" placeholder="admin@example.com"></div><div class="field"><label>Admin Password</label><input id="aPass" type="password" placeholder="Password"></div><button class="btn primary" style="width:100%" onclick="adminLogin()">Login</button><div class="status" id="loginStatus"></div></div>
<div id="app" class="hidden"><div class="top"><div><div class="brand">Ludo <span>Best 2</span> Admin</div><div class="muted" id="adminEmail"></div></div><button class="btn secondary" onclick="logout()">Logout</button></div><div class="grid"><div class="card"><div class="muted">Total Users</div><div class="stat" id="sUsers">0</div></div><div class="card"><div class="muted">Verified Users</div><div class="stat" id="sVerified">0</div></div><div class="card"><div class="muted">Active Users</div><div class="stat" id="sActive">0</div></div><div class="card"><div class="muted">Payment Methods</div><div class="stat" id="sPm">0</div></div></div>
<div class="panel"><div class="tabs"><button class="btn tab active" onclick="showTab('users',this)">Users</button><button class="btn tab secondary" onclick="showTab('payments',this)">Payment Methods</button></div><section id="users"><h3>User Management</h3><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Mobile</th><th>Gmail</th><th>Verified</th><th>Status</th><th>Action</th></tr></thead><tbody id="userRows"></tbody></table></div></section>
<section id="payments" class="hidden"><h3>Payment Method Management</h3><div class="formgrid"><div class="field"><label>Name</label><input id="pmName" placeholder="bKash"></div><div class="field"><label>Account Number</label><input id="pmNumber" placeholder="01XXXXXXXXX"></div><div class="field"><label>Image / GIF URL</label><input id="pmImage" placeholder="https://..."></div><div class="field"><label>Enabled</label><select id="pmEnabled" style="width:100%;padding:11px;border-radius:10px;background:#081423;color:#fff;border:1px solid #2b3e5b"><option value="true">Enabled</option><option value="false">Disabled</option></select></div></div><div class="field"><label>Instructions</label><textarea id="pmInstructions" placeholder="Payment instructions"></textarea></div><button class="btn primary" onclick="addPayment()">Add Payment Method</button><div class="tablewrap" style="margin-top:16px"><table class="table"><thead><tr><th>Name</th><th>Account</th><th>Image/GIF</th><th>Enabled</th><th>Action</th></tr></thead><tbody id="pmRows"></tbody></table></div></section></div></div></div>
<script>
const $=id=>document.getElementById(id);let token=localStorage.getItem('ludo_admin_token');
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const j=await r.json().catch(()=>({ok:false,message:'Server error'}));if(!r.ok)throw new Error(j.message||'Request failed');return j}
async function adminLogin(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('aEmail').value,password:$('aPass').value})});const j=await r.json();if(!r.ok)throw new Error(j.message);localStorage.setItem('ludo_admin_token',j.token);token=j.token;openApp(j.admin.email)}catch(e){$('loginStatus').textContent=e.message}}
async function openApp(email){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('adminEmail').textContent=email||'';await refresh()}
async function refresh(){try{const s=(await api('/api/admin/stats')).stats;$('sUsers').textContent=s.users;$('sVerified').textContent=s.verified;$('sActive').textContent=s.active;$('sPm').textContent=s.paymentMethods;const u=(await api('/api/admin/users')).users;$('userRows').innerHTML=u.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td>${esc(x.email)}</td><td>${x.email_verified?'Yes':'No'}</td><td><span class="badge ${x.status==='active'?'ok':'blocked'}">${x.status}</span></td><td><button class="btn ${x.status==='active'?'danger':'primary'}" onclick="toggleUser(${x.id},'${x.status}')">${x.status==='active'?'Block':'Activate'}</button></td></tr>`).join('');const p=(await api('/api/admin/payment-methods')).paymentMethods;$('pmRows').innerHTML=p.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.account_number)}</td><td>${x.image_url?'<a target="_blank" rel="noopener" href="'+esc(x.image_url)+'">View</a>':'-'}</td><td>${x.enabled?'Yes':'No'}</td><td><button class="btn danger" onclick="deletePayment(${x.id})">Delete</button></td></tr>`).join('')}catch(e){if(/authorization|login|session/i.test(e.message))logout();}}
async function toggleUser(id,status){await api('/api/admin/users/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:status==='active'?'blocked':'active'})});refresh()}
async function addPayment(){const data={name:$('pmName').value,account_number:$('pmNumber').value,image_url:$('pmImage').value,instructions:$('pmInstructions').value,enabled:$('pmEnabled').value==='true'};try{await api('/api/admin/payment-methods',{method:'POST',body:JSON.stringify(data)});['pmName','pmNumber','pmImage','pmInstructions'].forEach(id=>$(id).value='');refresh()}catch(e){alert(e.message)}}
async function deletePayment(id){if(!confirm('Delete this payment method?'))return;await api('/api/admin/payment-methods/'+id,{method:'DELETE'});refresh()}
function showTab(id,btn){document.querySelectorAll('#app section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function logout(){localStorage.removeItem('ludo_admin_token');token='';location.reload()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
(async()=>{if(!token)return;try{const j=await api('/api/admin/me');openApp(j.admin.email)}catch{logout()}})();
</script></body></html>
